name: generate snake
on:
  schedule:
    # Runs every 12 hours (Corrected cron syntax)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

# Added explicit write permissions to fix the 403 error
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Updated from v3 to v4 to fix Node 20 deprecation
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # Updated from v3.1.0 to v4 to fix Node 20 deprecation
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
